name: Zara Khan Cloud Ingestion Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: "Filter by Day (e.g. 'Day 5', 'Day 3', or leave empty for all pending)"
        required: false
        default: ""
      limit:
        description: "Max number of assets to process (leave empty for unlimited)"
        required: false
        default: ""
      pending_only:
        description: "Only process assets currently marked as PENDING (uncheck to re-prompt existing)"
        type: boolean
        default: true

jobs:
  ingest-and-prompt:
    name: Ingest Calendar & Synthesize Prompts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "
          import os, pathlib
          key = os.environ.get('GCP_SA_KEY', '').strip()
          if key:
              p = pathlib.Path('/tmp/gcp/service_account.json')
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(key, encoding='utf-8')
              print(f'[CI Setup] Saved service account key ({len(key)} chars) to {p}')
          else:
              print('[CI Setup] WARNING: GOOGLE_SERVICE_ACCOUNT_JSON secret is empty or not set!')
          "

      - name: Run Cloud Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/service_account.json
          CLOUD_MODE: "true"
        run: |
          ARGS="--cloud"
          if [ -n "${{ github.event.inputs.day }}" ]; then
            ARGS="$ARGS --day \"${{ github.event.inputs.day }}\""
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.pending_only }}" != "false" ]; then
            ARGS="$ARGS --pending-only"
          fi
          echo "Executing: python main.py $ARGS"
          eval python main.py $ARGS
